# EXPERIMENT for issue #157, not part of the deploy: the dev sidecar with the kernel network stack instead of
# userspace (netstack), to see whether the TLS handshake tail through Funnel comes from netstack.
# It needs NET_ADMIN and /dev/net/tun, which compose.server.yaml deliberately does without, so run it on dev only
# and only for the measurement. Steps: docs/self-host.md, section 5, "Funnel: slow handshakes".
#
#   docker compose -f compose.server.yaml -f ops/server/tailscale-kernel.override.yaml \
#     --env-file /home/asc/env/dev.env up -d tailscale
services:
  tailscale:
    environment:
      TS_USERSPACE: "false"
    cap_add: [NET_ADMIN]
    # Kernel mode runs iptables, which writes /run/xtables.lock; with a read-only root it fails
    # ("can't open lock file /run/xtables.lock: Read-only file system", seen 2026-11-21).
    read_only: false
    devices:
      - /dev/net/tun:/dev/net/tun
