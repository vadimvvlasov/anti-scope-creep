server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed build assets never change; everything else is revalidated.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `/` is the prerendered landing page (index.html). Deep links like /contracts/<id> get the app
    # shell, as on Cloudflare (public/_redirects).
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
