# The full system locally: `make up`, then open http://localhost:3000.
# Production runs the same backend image on AWS Lightsail and the frontend on Cloudflare Pages.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: asc
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asc"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    image: asc-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres:5432/asc
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    image: asc-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres:5432/asc
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret-not-for-production-use}
      ANALYZER: stub
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SEED_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
