name: Promote to prod

# By hand, after approval: the same image that runs in dev goes to prod, no rebuild.
# deploy.yml moves the :prod tag to it, and the home server pulls it (docs/self-host.md).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Backend image tag already deployed to dev (sha-<7 hex>). Empty = the last successful dev deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.check.outputs.image }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check the tag, its commit on main and the image in ghcr
        id: check
        env:
          TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$TAG" ]]; then
            # Ask the deploy history, not the dev server: dev may already run a newer image by hand.
            dev_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-dev.yml \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [[ -z "$dev_sha" ]]; then
              echo "No successful deploy-dev run found; pass image_tag" >&2; exit 1
            fi
            TAG="sha-${dev_sha::7}"
            echo "image_tag is empty; using the last dev deploy: $TAG"
          fi
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "image_tag must look like sha-<7 hex>, got: $TAG" >&2; exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${TAG#sha-}" --jq .sha)
          # Only commits that are on main: "ahead" means main has the commit plus newer ones.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "Commit $sha is not on main (compare status: $status)" >&2; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anti-scope-creep-backend:$TAG"
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "Image $image is not in ghcr; deploy that commit to dev first" >&2; exit 1
          fi
          echo "Promoting $image ($sha)"
          echo "Promoting \`$TAG\` ($sha) to prod" >> "$GITHUB_STEP_SUMMARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    # packages: write moves the :prod tag in ghcr.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ${{ needs.resolve.outputs.image }}
      ref: ${{ needs.resolve.outputs.sha }}
    # Passed by name: an environment secret that is not passed is empty in deploy.yml.
    secrets:
      MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
