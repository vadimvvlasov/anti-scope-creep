name: Deploy

# Reusable: deploy a backend image that is already in ghcr to one environment.
# Neon migrations, then the environment tag (:dev or :prod) moves to the image; the home server
# pulls it on its own timer (docs/self-host.md), and this workflow waits until GET /version
# reports it. Then the frontend Worker and a smoke test. Nothing here connects to the server.
# Called by deploy-dev.yml and promote-prod.yml. The secrets live in the GitHub Environment;
# callers pass them by name (not `secrets: inherit`), so this workflow gets only these two.
# The backend's own settings (DATABASE_URL, JWT_SECRET, CORS_ORIGINS, ...) are in the server's env files.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (dev or prod); also the image tag the server runs
        required: true
        type: string
      image:
        description: Backend image, ghcr.io/...:sha-<short-sha>
        required: true
        type: string
      ref:
        description: Full commit SHA the image was built from (frontend and scripts come from it)
        required: true
        type: string
      wrangler-env:
        description: Wrangler environment (dev); empty deploys the top-level prod Worker
        type: string
        default: ""
    # Not `required: true`: the callers have no environment, so the values resolve only
    # inside the deploy job (environment: inputs.environment).
    secrets:
      MIGRATIONS_DATABASE_URL:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      # The public URL of this environment's backend: https://asc-<env>.<tailnet>.ts.net
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - name: Check the settings
        run: |
          if [[ ! "$BACKEND_URL" =~ ^https://[^/]+$ ]]; then
            echo "Set the BACKEND_URL variable of this environment to https://<host>, without a trailing slash (now: '$BACKEND_URL')" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Migrate the Neon branch
        env:
          IMAGE: ${{ inputs.image }}
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL="$MIGRATIONS_DATABASE_URL" "$IMAGE" alembic upgrade head

      # The version comes from the image (pulled by the migrate step): images built before
      # GET /version existed have no APP_VERSION, and a rollback to one must still deploy.
      - name: Read the image version
        id: version
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          version=$(docker image inspect "$IMAGE" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_VERSION=//p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No rebuild: the environment tag becomes a second name for the image that was built and tested.
      - name: Move the ${{ inputs.environment }} tag to the image
        env:
          IMAGE: ${{ inputs.image }}
          ENV_TAG: ${{ inputs.environment }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "${IMAGE%:*}:$ENV_TAG" "$IMAGE"
          echo "Moved \`$ENV_TAG\` to \`${IMAGE##*:}\`" >> "$GITHUB_STEP_SUMMARY"

      # The server's timer runs every 5 minutes; the pull and the health check add a minute or two.
      # Network and TLS errors while the backend restarts count as "not yet".
      - name: Wait for the server to run the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "::warning::$IMAGE has no APP_VERSION, so the switch cannot be seen; waiting 6 minutes"
            sleep 360
          else
            python3 scripts/wait_version.py "$BACKEND_URL" "$VERSION" --timeout 600
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Vite inlines VITE_* at build time, so the frontend is rebuilt for every environment.
      # Its footer shows the backend image tag (sha-<7 hex>): both come from the same commit.
      # VITE_ANALYZER must match ANALYZER in the server's env file of this environment, so the
      # dialog and the Upload notice describe the analyzer that actually runs.
      - name: Build and deploy the frontend
        working-directory: frontend
        env:
          IMAGE: ${{ inputs.image }}
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_USE_MOCK: "false"
          VITE_ANALYZER: ${{ vars.ANALYZER || 'stub' }}
          # Product analytics (docs/analytics.md): funnel events to this backend's POST /events.
          VITE_ANALYTICS: "true"
          # The frontend's public address, for the landing page's link preview (og:image needs an
          # absolute URL). Empty keeps a relative URL.
          VITE_SITE_URL: ${{ vars.FRONTEND_URL }}
          # The hours the server is on, `HH:MM-HH:MM` in UTC (docs/spec.md "Service hours notice"). Empty: the notice
          # and the network-error message say the service is not available around the clock, without hours.
          VITE_SERVICE_HOURS: ${{ vars.SERVICE_HOURS }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export VITE_APP_VERSION="${IMAGE##*:}"
          npm ci
          npm run build
          npx --yes wrangler@4.147.0 deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ inputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
          # The local model runs one analysis at a time and may have to load first: the smoke analysis can
          # wait behind a user's (minutes), so it gets 20 minutes there instead of 2 (docs/self-host.md, 8).
          SMOKE_TIMEOUT: ${{ vars.ANALYZER == 'local' && '1200' || '120' }}
        run: |
          if [[ -n "$VERSION" ]]; then
            python3 scripts/smoke.py "$BACKEND_URL" --timeout "$SMOKE_TIMEOUT" --expect-version "$VERSION"
          else
            echo "::notice::$IMAGE has no APP_VERSION; version check skipped"
            python3 scripts/smoke.py "$BACKEND_URL" --timeout "$SMOKE_TIMEOUT"
          fi
          echo "Deployed \`${IMAGE##*:}\` to **$ENVIRONMENT**: $BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
