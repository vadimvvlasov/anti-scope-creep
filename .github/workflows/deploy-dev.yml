name: Deploy dev

# After CI passes on main (or by hand): build one image, then deploy.yml puts it on the
# Neon dev branch, the ephemeral Lightsail dev service and the dev frontend Worker.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha: ${{ steps.image.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Build and push the backend image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anti-scope-creep-backend:sha-${SHA::7}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" --build-arg APP_VERSION="sha-${SHA::7}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" backend/
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
      ref: ${{ needs.image.outputs.sha }}
      create-service: true
      wrangler-env: dev
    secrets: inherit
