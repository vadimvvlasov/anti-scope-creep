name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: asc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asc_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      # Store, migration and constraint tests also run on PostgreSQL.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/asc_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags after v7: pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Includes tests/test_openapi_contract.py: the app against openapi.yaml.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Standard library only (smoke test, Lovable prompt builder).
      - run: python3 -m unittest discover -s scripts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the full system (Postgres, migrations, backend, frontend)
        run: make up
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image (not pushed)
        run: docker build -t asc-backend backend/

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # Findings do not fail the build yet; review them in the artifact.
      - run: semgrep scan --config p/default --metrics=off --json --output semgrep.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep
          path: semgrep.json
          retention-days: 30
